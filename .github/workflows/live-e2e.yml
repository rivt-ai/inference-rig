name: Live E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (live)
    # Skip draft PRs. Stacked phase PRs stay draft until their phase is ready,
    # so live E2E only runs on PRs explicitly marked ready-for-review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Real-engine setup (web UI build, llama.cpp cache) is added with the
      # backends (Phase 6) and hardware validation (Phase 12).
      - name: Run live E2E
        run: make e2e-live
