name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release SemVer tag (for example v0.2.0 or v0.2.0-alpha.1)
        required: true
        type: string

# Read-only by default. The one job that publishes re-declares the write
# scopes it needs, so the MLX validation job called below — and any job added
# later — cannot write to the repository just by existing.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mlx:
    uses: ./.github/workflows/mlx.yml

  release:
    needs: [mlx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require main and prerelease SemVer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Releases must run from main, got $GITHUB_REF" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "Release version must be SemVer prefixed with v" >&2
            exit 1
          }
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Require passing main pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1200))
          # Security is the aggregate job in security.yml, so this list does
          # not have to name each individual scan. A known vulnerability, a
          # leaked credential or a CodeQL finding on this commit blocks
          # publication the same way a failing test does.
          for check in Test Lint Security; do
            while true; do
              read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq "([.check_runs[] | select(.name == \"$check\")] | sort_by(.started_at) | last) as \$r
                      | \"\(\$r.status // \"missing\") \(\$r.conclusion // \"none\")\"")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] && { echo "$check succeeded"; break; }
                echo "$check concluded $conclusion (need success)" >&2; exit 1
              fi
              (( SECONDS >= deadline )) && { echo "timed out waiting for $check" >&2; exit 1; }
              echo "waiting for $check (status: $status)..."; sleep 15
            done
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build web UI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install cyclonedx-gomod
        env:
          GOBIN: /usr/local/bin
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0

      - name: Package release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          commit_time=$(git show -s --format=%cI "$GITHUB_SHA")
          scripts/package-release.sh "$RELEASE_VERSION" "$GITHUB_SHA" "$commit_time"

      # The Security gate above proves the *commit* was clean when its checks
      # ran; this proves the four binaries actually being published are. It
      # scans the compiled artifact rather than the source tree, so what is
      # verified is the shipped bytes — including the dependency versions the
      # linker really chose — and it closes the window between that gate
      # passing and this build running.
      #
      # Every published target is scanned, not just the linux/amd64 one the
      # packaged E2E exercises: a vulnerability reachable only on darwin/arm64
      # would otherwise ship unexamined.
      - name: Scan release binaries for known vulnerabilities
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scan_dir=$(mktemp -d)
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            name="inferencerig_${RELEASE_VERSION}_${target}"
            tar -C "$scan_dir" -xzf "dist/release/$name.tar.gz"
            echo "== $target =="
            go tool govulncheck -mode=binary "$scan_dir/$name/infr"
          done

      - name: Cache pinned E2E fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/inferencerig-e2e
          key: e2e-fixtures-${{ hashFiles('scripts/e2e-fixtures.env') }}

      - name: Packaged-artifact E2E (linux/amd64)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          smoke_dir=$(mktemp -d)
          tar -C "$smoke_dir" -xzf "dist/release/inferencerig_${RELEASE_VERSION}_linux_amd64.tar.gz"
          binary="$smoke_dir/inferencerig_${RELEASE_VERSION}_linux_amd64/infr"
          "$binary" version
          "$binary" version --json | jq -e --arg version "$RELEASE_VERSION" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit'
          cd dist/release && sha256sum --check SHA256SUMS
          cd "$OLDPWD"
          eval "$(./scripts/provision-e2e-llamacpp.sh)" && \
            INFERENCERIG_E2E_BINARY="$binary" go test -tags=e2e ./test/e2e -count=1 -timeout=15m

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/release/*"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          prerelease_flag=()
          [[ "$RELEASE_VERSION" == *-* ]] && prerelease_flag=(--prerelease)
          gh release create "$RELEASE_VERSION" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            "${prerelease_flag[@]}"
