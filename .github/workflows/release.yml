name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease SemVer tag (for example v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and prerelease SemVer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Releases must run from main, got $GITHUB_REF" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "Release version must be prerelease SemVer prefixed with v" >&2
            exit 1
          }
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Require passing main pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1200))
          for check in Test Lint; do
            while true; do
              read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq "([.check_runs[] | select(.name == \"$check\")] | sort_by(.started_at) | last) as \$r
                      | \"\(\$r.status // \"missing\") \(\$r.conclusion // \"none\")\"")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] && { echo "$check succeeded"; break; }
                echo "$check concluded $conclusion (need success)" >&2; exit 1
              fi
              (( SECONDS >= deadline )) && { echo "timed out waiting for $check" >&2; exit 1; }
              echo "waiting for $check (status: $status)..."; sleep 15
            done
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build web UI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build and package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/release
          name="inferencerig_${RELEASE_VERSION}_linux_amd64"
          commit_time=$(git show -s --format=%cI "$GITHUB_SHA")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w \
              -X inferencerig/internal/buildinfo.Version=${RELEASE_VERSION} \
              -X inferencerig/internal/buildinfo.Commit=${GITHUB_SHA} \
              -X inferencerig/internal/buildinfo.CommitTime=${commit_time}" \
            -o "dist/${name}/inferencerig" .
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/release/${name}.tar.gz" "${name}"
          cd dist/release && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Smoke-test release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          smoke=$(mktemp -d)
          tar -C "$smoke" -xzf "dist/release/inferencerig_${RELEASE_VERSION}_linux_amd64.tar.gz"
          "$smoke/inferencerig_${RELEASE_VERSION}_linux_amd64/inferencerig" version
          cd dist/release && sha256sum --check SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            --prerelease
