name: Security

# The gates Test and Lint deliberately do not carry: known vulnerabilities in
# dependencies, static analysis of first-party code, leaked credentials, and
# the trustworthiness of the CI workflows themselves.
#
# The weekly schedule is not redundant with the pull_request trigger. Every
# check here can start failing without a commit — a CVE disclosed against a
# dependency nobody touched is precisely the case a push-triggered job never
# catches.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      # webui/dist is a build artifact that is not committed, and
      # webui/assets.go embeds it. Without it the webui package — and the
      # gateway packages importing it — load incompletely, which would quietly
      # narrow the scan rather than fail it.
      - name: Build web UI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm run build

      # govulncheck is a go.mod tool directive, not a `go install`, for a
      # reason specific to this module: `go install ...@latest` builds
      # govulncheck with the Go version its own go.mod names, which is older
      # than this module's, and such a binary cannot load these packages at all
      # ("package requires newer Go version"). The tool directive pins the
      # version in go.sum and builds it with the toolchain go.mod already
      # names.
      #
      # Reachability-based by design: it reports a vulnerability only when a
      # vulnerable symbol is actually called, so a finding here is actionable
      # rather than a version-range match to triage away.
      - name: govulncheck (source)
        run: go tool govulncheck ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go needs a real compile, so it drives the build itself rather than
          # relying on autobuild, which cannot know the web UI must exist first.
          - language: go
            build-mode: manual
          # The Svelte/TS client is analyzed from source; nothing to build.
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.language == 'go'
        with:
          version: 10.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.language == 'go'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # After init, so the CodeQL tracer observes the compiler invocations.
      - name: Build Go
        if: matrix.language == 'go'
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: /language:${{ matrix.language }}

  web-audit:
    name: Web dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # No pnpm cache here on purpose: this job runs `pnpm audit` and never
      # installs, so the store only exists when the cache happens to restore.
      # On a lockfile change the key misses, nothing creates the store, and
      # the post-job save fails the whole job.

      # govulncheck covers the Go module graph and nothing else; this is the
      # only check that sees webui/pnpm-lock.yaml. Dev dependencies are in
      # scope on purpose — vite, vitest and playwright execute in CI, so a
      # compromised one is a build-time compromise, not a test-only annoyance.
      - name: pnpm audit
        run: cd webui && pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: the action diffs the base ref's
    # manifests against the head ref's. On push and on the weekly schedule
    # there is no such pair, so the job is skipped rather than failed — the
    # gate below treats a skipped job as acceptable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Everything else here scans dependencies that are already merged.
      # govulncheck reports a CVE in main after the fact; Dependabot opens a PR
      # once one is disclosed. Neither stops a pull request from introducing a
      # known-vulnerable package in the first place, which is what this does.
      # It covers go.mod and webui/pnpm-lock.yaml alike, since it reads the
      # dependency graph rather than either ecosystem's tooling.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matches `pnpm audit --audit-level high` in web-audit, so the two
          # checks cannot disagree about whether a given advisory blocks merge.
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a credential that was committed and then removed in a
      # later commit is still published, and a shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Installed from a pinned tag rather than run as a third-party action,
      # which is how this repository already installs golangci-lint and keeps
      # the set of actions it trusts small.
      - name: Install gitleaks
        env:
          GOBIN: /usr/local/bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # --redact so a real finding does not get reprinted into a public log.
      - name: gitleaks
        run: gitleaks detect --source . --redact --no-banner

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # CI is itself an attack surface: these workflows hold contents: write
      # and publish releases. zizmor audits them for the failure modes that
      # matter here — spoofable actor checks, over-broad permissions, dangerous
      # triggers, and unpinned third-party actions. Policy lives in
      # .github/zizmor.yml.
      - name: Install zizmor
        run: pipx install zizmor==1.29.0

      - name: zizmor
        env:
          # Enables the online audits (for example, flagging an action whose
          # repository has been archived or renamed).
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/

  security:
    # One stable check name for branch protection and for the release
    # workflow's gate to wait on, so adding a job above never means editing
    # release.yml's required-check list.
    name: Security
    needs: [govulncheck, codeql, web-audit, dependency-review, secrets, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "security job results: $RESULTS"
          for result in $RESULTS; do
            # skipped is allowed only because dependency-review declares an
            # event guard; no job above is skipped for any other reason, since
            # none of them depend on another. A failure still reports failure,
            # and a cancelled run is still not success.
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a security job did not succeed" >&2
              exit 1
            fi
          done
