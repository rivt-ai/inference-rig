name: Dependabot auto-merge

# `pull_request`, not `pull_request_target`. Dependabot raises its PRs from
# branches inside this repository, so the ordinary trigger fires for them and
# this workflow never needs the base-repo write token that
# `pull_request_target` grants to a run initiated by a pull request.
on: pull_request

permissions: {}

jobs:
  automerge:
    # `github.event.pull_request.user.login` is the PR's author and is fixed
    # for the life of the PR. `github.actor` — which this check used before —
    # is whoever most recently triggered the event, so a re-run or a later
    # push can make another author's PR present as Dependabot's.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Scoped to the job rather than the workflow, so write access exists only
    # where it is used.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only patch/minor bumps auto-merge. Majors (and grouped PRs that
      # contain a major) stop here for manual review.
      #
      # --auto queues the merge behind the repository's required checks, so
      # Test, Lint and Security still have to pass before anything lands.
      #
      # The merge itself must NOT run as secrets.GITHUB_TOKEN: GitHub never
      # starts a new workflow run from an event produced by the default
      # token (the one documented exception is workflow_dispatch /
      # repository_dispatch), so a GITHUB_TOKEN-driven merge to main silently
      # skips every `push: branches: [main]` workflow — Test, Lint, Security,
      # E2E all included. That starved release.yml's "Require passing main
      # pipeline" gate, which polls for exactly those check-runs on main and
      # has nothing to find, so every release after a Dependabot auto-merge
      # timed out and failed.
      #
      # DEPENDABOT_AUTOMERGE_PAT is a fine-grained PAT scoped to this repo
      # only (Contents: read/write, Pull requests: read/write) so the merge
      # push is attributed to that token instead and main's CI fires
      # normally. Falls back to GITHUB_TOKEN — same broken behavior as
      # before — until that secret is added.
      - name: Enable auto-merge for patch/minor
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
