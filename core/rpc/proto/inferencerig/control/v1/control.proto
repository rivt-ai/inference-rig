syntax = "proto3";

package inferencerig.control.v1;

option go_package = "inferencerig/core/rpc/gen/v1;controlv1";

import "google/protobuf/struct.proto";

service ControlService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc PutProfile(PutProfileRequest) returns (PutProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc InstallBackend(InstallBackendRequest) returns (InstallBackendResponse);
  // RollbackBackend returns a managed engine to its previously recorded
  // installation.
  // The response is InstallBackendResponse: a rollback reports the same thing
  // an install does — which version is now active and where it lives.
  rpc RollbackBackend(RollbackBackendRequest) returns (InstallBackendResponse);
  rpc GetBackendInstallStatus(GetBackendInstallStatusRequest) returns (GetBackendInstallStatusResponse);
  rpc StartRuntime(StartRuntimeRequest) returns (StartRuntimeResponse);
  rpc StopRuntime(StopRuntimeRequest) returns (StopRuntimeResponse);
  // ResetRuntimes stops every runtime and clears the active backend, which is
  // how a host switches backends. It is not a daemon restart.
  rpc ResetRuntimes(ResetRuntimesRequest) returns (ResetRuntimesResponse);
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse);
  rpc ResolveProfileModel(ResolveProfileModelRequest) returns (ResolveProfileModelResponse);
  // ResolveModel resolves an arbitrary catalog reference without requiring a
  // profile, so the UI can browse and download before a profile exists.
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
  rpc StartModelDownload(StartModelDownloadRequest) returns (StartModelDownloadResponse);
  rpc GetModelDownload(GetModelDownloadRequest) returns (GetModelDownloadResponse);
  rpc CancelModelDownload(CancelModelDownloadRequest) returns (CancelModelDownloadResponse);
  rpc GetSignals(GetSignalsRequest) returns (GetSignalsResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
  rpc ListModelCatalog(ListModelCatalogRequest) returns (ListModelCatalogResponse);
  rpc WatchModelCatalog(WatchModelCatalogRequest) returns (stream WatchModelCatalogResponse);
  rpc ListLocalModels(ListLocalModelsRequest) returns (ListLocalModelsResponse);
  rpc DeleteLocalModel(DeleteLocalModelRequest) returns (DeleteLocalModelResponse);
  rpc ApplyDownloadToProfile(ApplyDownloadToProfileRequest) returns (ApplyDownloadToProfileResponse);
  rpc CleanupProfile(CleanupProfileRequest) returns (CleanupProfileResponse);
  rpc SetProfileAutostart(SetProfileAutostartRequest) returns (SetProfileAutostartResponse);
  rpc SetStartupServices(SetStartupServicesRequest) returns (SetStartupServicesResponse);
  rpc RestartRuntime(RestartRuntimeRequest) returns (RestartRuntimeResponse);
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GetBackendParams(GetBackendParamsRequest) returns (GetBackendParamsResponse);

  // EstimateFit reports whether a model of a given size fits the host, for the
  // memory model the named backend uses. Both backends have implemented this
  // since Phase 6/7; it simply had no way to reach a caller.
  rpc EstimateFit(EstimateFitRequest) returns (EstimateFitResponse);

  // Service logs. The archive store behind these has existed since Phase 2 with
  // its own retention policy and was unreachable from any adapter.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  rpc WatchLogs(WatchLogsRequest) returns (stream WatchLogsResponse);
  rpc ListLogArchives(ListLogArchivesRequest) returns (ListLogArchivesResponse);
  rpc GetLogArchive(GetLogArchiveRequest) returns (GetLogArchiveResponse);
  rpc DeleteLogArchive(DeleteLogArchiveRequest) returns (DeleteLogArchiveResponse);
  rpc ClearLogArchives(ClearLogArchivesRequest) returns (ClearLogArchivesResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string service = 2;
}

message ListBackendsRequest {}
message ListBackendsResponse {
  bool ok = 1;
  repeated BackendInfo backends = 2;
}
message BackendInfo {
  string name = 1;
  BackendCapabilities capabilities = 2;
}
message BackendCapabilities {
  bool single_file_artifacts = 1;
  bool multi_file_artifacts = 2;
  bool discrete_vram = 3;
  bool unified_memory = 4;
  bool managed_install = 5;
  bool single_active_profile = 6;
  bool parameter_introspection = 7;
}

message ListProfilesRequest {}
message ListProfilesResponse {
  bool ok = 1;
  repeated Profile profiles = 2;
}
message GetProfileRequest { string name = 1; }
message PutProfileRequest {
  string name = 1;
  string profile_yaml = 2;
  bool create_only = 3;
  // profile is the structured alternative to profile_yaml, used when
  // profile_yaml is empty. The server renders the YAML, so a structured editor
  // does not need a YAML implementation of its own and cannot disagree with the
  // server about how a profile serializes.
  Profile profile = 4;
}
message DeleteProfileRequest { string name = 1; }
message GetProfileResponse {
  bool ok = 1;
  Profile profile = 2;
}
message PutProfileResponse {
  bool ok = 1;
  Profile profile = 2;
}
message Profile {
  string name = 1;
  string backend = 2;
  string profile_yaml = 3;
  string model_source = 4;
  string model_reference = 5;
  string host = 6;
  int32 port = 7;
  // engine_args mirrors profiles.Profile.EngineArgs. Struct rather than
  // map<string, string> because engine args carry scalars, bools, and lists,
  // and both backends depend on the distinction: MLX renders a false bool as
  // --no-key and a list as a repeated flag.
  google.protobuf.Struct engine_args = 8;
}
message DeleteProfileResponse { bool ok = 1; }

message InstallBackendRequest {
  string backend = 1;
  string version = 2;
  bool upgrade = 3;
  bool force = 4;
}
message InstallBackendResponse {
  bool ok = 1;
  string version = 2;
  string path = 3;
  bool changed = 4;
  string message = 5;
}
message RollbackBackendRequest { string backend = 1; }
message GetBackendInstallStatusRequest { string backend = 1; }
message GetBackendInstallStatusResponse {
  bool ok = 1;
  bool installed = 2;
  bool managed = 3;
  string version = 4;
  string path = 5;
}

// replace states that the caller accepts the currently running profile being
// stopped. Without it, starting a second profile on a backend that serves one
// at a time is a conflict rather than an implicit kill.
message StartRuntimeRequest {
  string profile = 1;
  bool replace = 2;
}
message StartRuntimeResponse {
  bool ok = 1;
  CommandResult result = 2;
  RuntimeStatus status = 3;
}
message StopRuntimeRequest { string profile = 1; }
message StopRuntimeResponse {
  bool ok = 1;
  CommandResult result = 2;
  RuntimeStatus status = 3;
}
message ResetRuntimesRequest {}
message ResetRuntimesResponse {
  bool ok = 1;
  CommandResult result = 2;
}
// GetRuntimeStatusRequest with an empty profile reports every profile at once.
// A dashboard polling each profile separately would issue one call per profile
// per tick.
message GetRuntimeStatusRequest { string profile = 1; }
message GetRuntimeStatusResponse {
  bool ok = 1;
  // status is the aggregate when no profile was named, or that profile's status.
  RuntimeStatus status = 2;
  // profiles is populated only for the all-profiles form.
  repeated ProfileRuntimeStatus profiles = 3;
}
message ProfileRuntimeStatus {
  string name = 1;
  string backend = 2;
  RuntimeStatus status = 3;
}
message CommandResult {
  string action = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  int64 duration_ms = 5;
}
message RuntimeStatus {
  string state = 1;
  string detail = 2;
  string checked_at = 3;
  repeated ProcessStatus processes = 4;
}
message ProcessStatus {
  string name = 1;
  string state = 2;
  int32 pid = 3;
  string host = 4;
  int32 port = 5;
  bool ready = 6;
  string last_error = 7;
}

message ResolveProfileModelRequest { string profile = 1; }
message ResolveProfileModelResponse {
  bool ok = 1;
  ResolvedModel model = 2;
  ArtifactPlan plan = 3;
}
message ResolvedModel {
  string source = 1;
  string reference = 2;
  bool multi_file = 3;
  repeated Artifact artifacts = 4;
}
message Artifact {
  string name = 1;
  string uri = 2;
  int64 size_bytes = 3;
}
message ArtifactPlan {
  bool multi_file = 1;
  string target_root = 2;
  repeated ArtifactItem items = 3;
  int64 total_bytes = 4;
}
message ArtifactItem {
  string uri = 1;
  string filename = 2;
  string target_path = 3;
  int64 size_bytes = 4;
}

message ResolveModelRequest {
  string backend = 1;
  // reference is a catalog reference or repository URL.
  string reference = 2;
  // variant_reference selects one artifact inside the repository the reference
  // names, exactly as Variant.reference reports it. A catalog entry is a
  // repository plus a file within it; sending only the filename leaves no host
  // to fetch from, so both halves travel together.
  string variant_reference = 3;
}
message ResolveModelResponse {
  bool ok = 1;
  ResolvedModel model = 2;
  ArtifactPlan plan = 3;
}

message StartModelDownloadRequest {
  // profile downloads that profile's model. Leave it empty and set
  // backend + reference to download a catalog entry before any profile exists,
  // which is the order the catalog UI works in.
  string profile = 1;
  bool force = 2;
  string backend = 3;
  string reference = 4;
  // variant_reference selects one artifact inside the repository, as in
  // ResolveModelRequest.
  string variant_reference = 5;
}
message StartModelDownloadResponse {
  bool ok = 1;
  ModelDownload download = 2;
}
message GetModelDownloadRequest { string id = 1; }
message GetModelDownloadResponse {
  bool ok = 1;
  ModelDownload download = 2;
}
message CancelModelDownloadRequest { string id = 1; }
message CancelModelDownloadResponse {
  bool ok = 1;
  ModelDownload download = 2;
}
message ModelDownload {
  string id = 1;
  string state = 2;
  bool multi_file = 3;
  string target_path = 4;
  int32 item_count = 5;
  int64 received_bytes = 6;
  int64 total_bytes = 7;
  double percent = 8;
  string error = 9;
  string started_at = 10;
  string completed_at = 11;
  string backend = 12;
  string profile = 13;
}

message GetSignalsRequest {}
message GetSignalsResponse {
  bool ok = 1;
  Signals signals = 2;
}
message Signals {
  string captured_at = 1;
  uint64 total_memory_bytes = 2;
  uint64 available_memory_bytes = 3;
  int32 logical_cpu_cores = 4;
  double cpu_used_percent = 5;
  repeated string warnings = 6;
  repeated Accelerator accelerators = 7;
  repeated Disk disks = 8;
  uint64 used_memory_bytes = 9;
  double used_memory_percent = 10;
  HostInfo host = 11;
  // runtime carries per-process resource use. The collector has produced this
  // since Phase 2; the message previously dropped it on the floor.
  repeated RuntimeProcess runtime = 12;
}

message HostInfo {
  string hostname = 1;
  string os = 2;
  string platform = 3;
}

message RuntimeProcess {
  string name = 1;
  int32 pid = 2;
  uint64 rss_bytes = 3;
  double cpu_percent = 4;
  string command = 5;
}

// Accelerator is one GPU-class compute device. unified_memory distinguishes the
// two memory models a host can have: a unified device (Apple Metal) shares
// system RAM, so its byte fields mirror system memory, while a discrete device
// reports its own dedicated VRAM. One message serves both.
message Accelerator {
  string name = 1;
  bool unified_memory = 2;
  uint64 total_memory_bytes = 3;
  uint64 used_memory_bytes = 4;
  // The fields below are optional and often unset: utilisation needs a vendor
  // tool (NVML, Metal counters), and Apple Silicon does not report GPU
  // temperature without elevated privileges. Clients must treat has_* as the
  // signal to render, not a zero value, which is indistinguishable from idle.
  double utilization_percent = 5;
  bool has_utilization = 6;
  double temperature_celsius = 7;
  bool has_temperature = 8;
  // source names what produced this reading, so an implausible number can be
  // traced to its collector.
  string source = 9;
}

message Disk {
  string label = 1;
  string path = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
  double used_percent = 5;
  uint64 free_bytes = 6;
}

message ListEventsRequest {}
message ListEventsResponse {
  bool ok = 1;
  repeated Event events = 2;
}
message WatchEventsRequest {}
message WatchEventsResponse { Event event = 1; }
message Event {
  string id = 1;
  string time = 2;
  string action = 3;
  bool success = 4;
  string error_kind = 5;
  string duration = 6;
  // The fields below are set only on runtime state-machine transitions
  // (action "runtime.transition"). operation_id ties the transitions of one
  // start, stop or reset together, so a client follows a lifecycle through the
  // event stream instead of polling status.
  string operation_id = 7;
  string profile = 8;
  string backend = 9;
  string state = 10;
}

message ListModelCatalogRequest {
  string backend = 1;
  string query = 2;
  int32 limit = 3;
  // sort orders results server-side: "downloads", "likes", "modified", "fit".
  string sort = 4;
  // min_fit drops models whose best variant does not reach this fit level.
  FitLevel min_fit = 5;
}
message ListModelCatalogResponse {
  bool ok = 1;
  repeated CatalogModel models = 2;
  bool cache_hit = 3;
  bool stale = 4;
  // machine is the host the fit estimates were computed against, so a client
  // can explain a verdict instead of just showing a colour.
  MachineProfile machine = 5;
  CatalogCacheState cache = 6;
  // errors carries per-source failures from a partially successful refresh.
  repeated string errors = 7;
}
message MachineProfile {
  uint64 total_memory_bytes = 1;
  uint64 available_memory_bytes = 2;
  string accelerator_name = 3;
  bool unified_memory = 4;
  uint64 accelerator_memory_bytes = 5;
}
message CatalogCacheState {
  bool hit = 1;
  bool stale = 2;
  bool refreshing = 3;
  string updated_at = 4;
  int64 ttl_seconds = 5;
}
message CatalogModel {
  string id = 1;
  string url = 2;
  int64 downloads = 3;
  int64 likes = 4;
  string last_modified = 5;
  repeated string tags = 6;
  repeated ModelVariant variants = 7;
  // best_variant is the largest variant that still fits the host, which is what
  // a one-click download should use.
  ModelVariant best_variant = 8;
}
message ModelVariant {
  string name = 1;
  string reference = 2;
  int64 size_bytes = 3;
  bool multi_file = 4;
  // quant is the backend's own quantisation label for this variant: a GGUF
  // quant for llama.cpp, a bit width for MLX. Empty when the backend does not
  // express one.
  string quant = 5;
  FitEstimate fit = 6;
}

enum FitLevel {
  FIT_LEVEL_UNSPECIFIED = 0;
  FIT_LEVEL_UNKNOWN = 1;
  FIT_LEVEL_FITS = 2;
  FIT_LEVEL_MARGINAL = 3;
  FIT_LEVEL_TOO_LARGE = 4;
}

message FitEstimate {
  FitLevel level = 1;
  string reason = 2;
  int64 required_bytes = 3;
  int64 available_bytes = 4;
}

message EstimateFitRequest {
  string backend = 1;
  // profile estimates for an existing profile's model; size_bytes estimates for
  // a candidate of a known size. Exactly one is expected.
  string profile = 2;
  int64 size_bytes = 3;
}
message EstimateFitResponse {
  bool ok = 1;
  FitEstimate fit = 2;
  MachineProfile machine = 3;
}
message WatchModelCatalogRequest {}
message WatchModelCatalogResponse {
  string backend = 1;
  string query = 2;
  string error = 3;
}
message ListLocalModelsRequest { string backend = 1; }
message ListLocalModelsResponse {
  bool ok = 1;
  repeated LocalModel models = 2;
}
message LocalModel {
  string path = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string modified_at = 4;
  // used_by_profiles names the profiles referencing this model. It is what
  // separates a configured model from a stray download, and it is what makes
  // deleting one an informed choice.
  repeated string used_by_profiles = 5;
}
message DeleteLocalModelRequest {
  string backend = 1;
  string path = 2;
  // cascade_profiles also removes the profiles that reference this model.
  // Without it, deleting a model a profile depends on leaves that profile
  // pointing at nothing.
  bool cascade_profiles = 3;
}
message DeleteLocalModelResponse { bool ok = 1; }

message ApplyDownloadToProfileRequest {
  string profile = 1;
  string id = 2;
  // preview computes the change without writing it, so the UI can show what
  // applying a download would do to a profile before it does it.
  bool preview = 3;
}
message ApplyDownloadToProfileResponse {
  bool ok = 1;
  Profile profile = 2;
  // preview_diff is set only when the request asked for a preview.
  TextDiff preview_diff = 3;
}
message TextDiff {
  string original = 1;
  string updated = 2;
}
message CleanupProfileRequest { string name = 1; }
message CleanupProfileResponse { bool ok = 1; }
message SetProfileAutostartRequest {
  string name = 1;
  bool enabled = 2;
}
message SetProfileAutostartResponse { bool ok = 1; }
message SetStartupServicesRequest { repeated string services = 1; }
message SetStartupServicesResponse { bool ok = 1; }
message RestartRuntimeRequest { string profile = 1; }
message RestartRuntimeResponse {
  bool ok = 1;
  CommandResult stopped = 2;
  CommandResult started = 3;
  RuntimeStatus status = 4;
}
message GetInfoRequest {}
message GetInfoResponse {
  bool ok = 1;
  int32 profiles = 2;
  int32 backends = 3;
  repeated string running_profiles = 4;
  repeated string autostart_profiles = 5;
  repeated string startup_services = 6;
  BuildInfo build = 7;
  // active_backend is the one backend currently serving, empty when none is.
  // Profiles naming any other backend cannot start until a reset.
  string active_backend = 8;
}
message BuildInfo {
  string version = 1;
  string commit = 2;
  string commit_time = 3;
}
// Logs. service is a free-form service name ("control", "web", or a backend
// runtime) rather than a closed enum, because which services exist depends on
// which backends are installed.
message GetLogsRequest {
  string service = 1;
  int32 lines = 2;
}
message GetLogsResponse {
  bool ok = 1;
  string service = 2;
  string text = 3;
}
message WatchLogsRequest { string service = 1; }
message WatchLogsResponse {
  string service = 1;
  string line = 2;
}
message ListLogArchivesRequest {}
message ListLogArchivesResponse {
  bool ok = 1;
  repeated LogArchive archives = 2;
}
message LogArchive {
  string id = 1;
  string service = 2;
  int64 size_bytes = 3;
  string archived_at = 4;
}
message GetLogArchiveRequest {
  string id = 1;
  int32 lines = 2;
}
message GetLogArchiveResponse {
  bool ok = 1;
  string service = 2;
  string text = 3;
}
message DeleteLogArchiveRequest { string id = 1; }
message DeleteLogArchiveResponse {
  bool ok = 1;
  int32 deleted = 2;
}
message ClearLogArchivesRequest {}
message ClearLogArchivesResponse {
  bool ok = 1;
  int32 deleted = 2;
}

message GetBackendParamsRequest { string backend = 1; }
message GetBackendParamsResponse {
  bool ok = 1;
  repeated BackendParameter params = 2;
}
// BackendParameter describes one settable profile parameter. The extra fields
// beyond name/description/required are what let a client offer completion and
// validation for any backend, replacing the hardcoded llama.cpp flag table the
// llamarig UI shipped in its own source.
message BackendParameter {
  string name = 1;
  string description = 2;
  bool required = 3;
  repeated string aliases = 4;
  string value_hint = 5;
  string default_value = 6;
  ParameterType type = 7;
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  PARAMETER_TYPE_STRING = 1;
  PARAMETER_TYPE_INT = 2;
  PARAMETER_TYPE_BOOL = 3;
  PARAMETER_TYPE_LIST = 4;
}
