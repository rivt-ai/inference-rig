# Locked artifact set for the managed mlx-lm environment (mlx-lm 0.31.3).
#
# Installed with `pip install --no-deps -r`, so this file is the complete set of
# packages that ever reaches a managed environment: pip resolves nothing at
# install time and a new upstream release cannot enter an install unnoticed.
#
# Regenerate after bumping ManagedVersion in backend.go:
#
#   pip download --only-binary=:all: --platform macosx_14_0_arm64 \
#       --python-version 3.11 --dest wheels 'mlx-lm==<version>'
#
# and add the mlx runtime, which pip skips off-Darwin because mlx-lm gates it on
# platform_system == "Darwin" (this backend installs on darwin/arm64 only).
#
# ponytail: version pins, not hashes. Hashes would pin the wheel to one
# interpreter and platform tag and break every other managed host; add
# --require-hashes with a per-interpreter lock if artifact identity ever has to
# be provable rather than just reproducible.
