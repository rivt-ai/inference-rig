<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InferenceRig</title>
  <style>
    body{font:16px system-ui;max-width:72rem;margin:3rem auto;padding:0 1rem;background:#101418;color:#eef}
    button{padding:.5rem 1rem} pre{background:#1b2229;padding:1rem;overflow:auto}
  </style>
</head>
<body>
  <h1>InferenceRig</h1>
  <p>Canonical control-plane status</p>
  <button id="refresh">Refresh</button>
  <pre id="state">Loading…</pre>
  <script>
    async function refresh() {
      const [backends, profiles] = await Promise.all([
        fetch('/api/backends').then(r => r.json()),
        fetch('/api/profiles').then(r => r.json())
      ]);
      document.querySelector('#state').textContent = JSON.stringify({backends, profiles}, null, 2);
    }
    document.querySelector('#refresh').addEventListener('click', refresh);
    refresh().catch(error => document.querySelector('#state').textContent = error);
  </script>
</body>
</html>
