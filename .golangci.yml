version: "2"

# Standard complexity/duplication/size linters. The custom module-wide Go LOC
# budget linter (goclocbudget) from the reference repos returns in a later
# phase once there is substantial ported code to budget.
linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - dupl

  settings:
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
