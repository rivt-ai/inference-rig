version: "2"

# Standard complexity/duplication/size linters plus the module implementation
# LOC budget enforced by the custom CI binary.
linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - dupl
    - goclocbudget

  settings:
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
    custom:
      goclocbudget:
        type: "module"
        description: "Enforces the implementation Go LOC budget using gocloc."
        settings:
          max-go-code-lines: 14000
          include-tests: false
          exclude-generated: true
          exclude-dirs:
            - vendor
            - .git
            - node_modules
            - webui/dist
            # backendtest is the shared fake and contract suite every backend's
            # tests run against. It is test code that only happens not to be
            # named _test.go, because packages under test import it; counting it
            # as implementation contradicts include-tests: false above.
            # scripts/go-coverage.sh excludes the same package for the same
            # reason.
            - backends/backendtest
